<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Gradients for 3D cylinder effect -->
    <linearGradient id="cylinderSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#990000;stop-opacity:1" />
      <stop offset="15%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#EE0000;stop-opacity:1" />
      <stop offset="85%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#880000;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="topEllipse">
      <stop offset="0%" style="stop-color:#FF3333;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#CC0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Top ellipse (lighter) -->
  <ellipse cx="60" cy="35" rx="35" ry="12" fill="url(#topEllipse)"/>
  
  <!-- Cylinder body -->
  <rect x="25" y="35" width="70" height="50" fill="url(#cylinderSide)"/>
  
  <!-- Bottom ellipse (darker) -->
  <ellipse cx="60" cy="85" rx="35" ry="12" fill="#AA0000"/>
  
  <!-- Wing/Feather on front - more prominent and stylized -->
  <g transform="translate(40, 45)">
    <!-- Main feather shaft -->
    <path d="M 8 0 L 10 0 L 10 35 L 8 35 Z" fill="white" opacity="0.95"/>
    
    <!-- Feather vanes (barbs) -->
    <path d="M 9 5 Q 0 8 -5 12 L -3 10 Q 3 7 9 8 Z" fill="white" opacity="0.9"/>
    <path d="M 9 10 Q 2 13 -3 17 L -1 15 Q 5 12 9 13 Z" fill="white" opacity="0.9"/>
    <path d="M 9 15 Q 3 18 -1 22 L 1 20 Q 6 17 9 18 Z" fill="white" opacity="0.9"/>
    <path d="M 9 20 Q 4 23 1 27 L 3 25 Q 7 22 9 23 Z" fill="white" opacity="0.9"/>
    <path d="M 9 25 Q 5 28 3 32 L 5 30 Q 8 27 9 28 Z" fill="white" opacity="0.9"/>
    
    <!-- Right side vanes -->
    <path d="M 10 5 Q 17 8 22 12 L 20 10 Q 15 7 10 8 Z" fill="white" opacity="0.85"/>
    <path d="M 10 10 Q 16 13 20 17 L 18 15 Q 14 12 10 13 Z" fill="white" opacity="0.85"/>
    <path d="M 10 15 Q 15 18 18 22 L 16 20 Q 13 17 10 18 Z" fill="white" opacity="0.85"/>
    <path d="M 10 20 Q 14 23 16 27 L 14 25 Q 12 22 10 23 Z" fill="white" opacity="0.85"/>
  </g>
  
  <!-- Subtle highlight on cylinder -->
  <ellipse cx="75" cy="40" rx="12" ry="5" fill="white" opacity="0.15"/>
</svg>