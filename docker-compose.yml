version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flyway-dashboard-server
    ports:
      - "3001:3001"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost
      - JDBC_ENCRYPTION_KEY=${JDBC_ENCRYPTION_KEY:-defaultkey123456789012345678901234567890123456789012345678901234}
    volumes:
      - ./server/db:/app/db
      - ./server/.env:/app/.env:ro
      - ./server/jdbc-connections.json:/app/jdbc-connections.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - flyway-network

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flyway-dashboard-ui
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://server:3001
    volumes:
      - ./public/config.json:/usr/share/nginx/html/config.json:ro
    restart: unless-stopped
    networks:
      - flyway-network

networks:
  flyway-network:
    driver: bridge

volumes:
  db-data:
